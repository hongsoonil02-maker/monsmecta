name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci || npm install

      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.VITE_GOOGLE_APPS_SCRIPT_URL }}" ]; then
            echo "::error::VITE_GOOGLE_APPS_SCRIPT_URL secret is not set. Register it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Create production env file
        run: |
          echo "VITE_GOOGLE_APPS_SCRIPT_URL=${{ secrets.VITE_GOOGLE_APPS_SCRIPT_URL }}" >> .env.production
          if [ -n "${{ secrets.VITE_CHATBOT_API_URL }}" ]; then
            echo "VITE_CHATBOT_API_URL=${{ secrets.VITE_CHATBOT_API_URL }}" >> .env.production
          fi

      - name: Build
        run: npm run build
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
