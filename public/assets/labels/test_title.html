<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #180b02; display: flex; justify-content: center; padding: 20px; font-family: sans-serif; }
.hero-row { display: flex; align-items: center; justify-content: center; gap: 1mm; width: 49.5mm; }
.pet { width: 7.5mm; height: 7.5mm; flex: 0 0 7.5mm; }
.ttl-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; min-width: 0; }
.main-brand { font-size: 5.6mm; font-weight: 900; color: #fff; line-height: 1; text-shadow: 0.35mm 0.35mm 0 #d97706; white-space: nowrap; }
.sub-name { font-size: 3.8mm; font-weight: 900; color: #fbbf24; line-height: 1.1; margin-top: 0.4mm; text-shadow: 0.25mm 0.25mm 0 rgba(0,0,0,0.5); white-space: nowrap; }
.sub-en { font-size: 1.5mm; font-weight: 800; color: #381e05; background: #fed7aa; border-radius: 999px; padding: 0.2mm 1.2mm; line-height: 1.1; margin-top: 0.4mm; white-space: nowrap; letter-spacing: 0.05em; }
</style>
</head>
<body>
<div class="hero-row">
  <svg class="pet" viewBox="0 0 44 44"><circle cx="22" cy="22" r="20" fill="#e9a869"/></svg>
  <div class="ttl-wrap">
    <div class="main-brand">몬스멕타<sup style="font-size:0.5em;">™</sup></div>
    <div class="sub-name">헤파맥스</div>
    <div class="sub-en">MONSMECTA HEPAMAX</div>
  </div>
  <svg class="pet" viewBox="0 0 44 44"><circle cx="22" cy="22" r="20" fill="#fff"/></svg>
</div>
</body>
</html>
