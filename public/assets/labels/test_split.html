<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #1e1645; display: flex; justify-content: center; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; }

.col-left { width: 38.3mm; background: #1e1645; color: #fff; padding: 1mm; }

.ing { background: #e0e7ff; color: #1e1645; border-radius: 1.8mm; padding: 0.7mm 1.0mm; }
.ing-h { display: flex; align-items: center; justify-content: space-between; padding-bottom: 0.3mm; margin-bottom: 0.35mm; border-bottom: 0.18mm dashed #a5b4fc; }
.ing-h .ti { font-size: 1.2mm; font-weight: 900; }
.ing-h .ref { font-size: 0.95mm; font-weight: 800; color: #fff; background: #6366f1; border-radius: 999px; padding: 0.2mm 0.8mm; }

.row { display: flex; align-items: baseline; gap: 0.5mm; margin-bottom: 0.22mm; }
.row:last-child { margin-bottom: 0; }
.no { width: 1.3mm; height: 1.3mm; border-radius: 50%; background: #1e1645; color: #fff; font-size: 0.85mm; font-weight: 900; display: flex; align-items: center; justify-content: center; flex: 0 0 1.3mm; }
.rb { flex: 1; min-width: 0; }
.rm-row { display: flex; justify-content: space-between; align-items: baseline; width: 100%; gap: 0.8mm; }
.rm-name { font-size: 0.92mm; font-weight: 700; letter-spacing: -0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #1e1645; }
.rm-val { font-size: 0.94mm; font-weight: 900; letter-spacing: -0.02em; white-space: nowrap; flex-shrink: 0; margin-left: auto; color: #4338ca; text-align: right; }
</style>
</head>
<body>
<div class="col-left">
  <div class="ing">
    <div class="ing-h">
      <span class="ti">주요 성분량(5대 복합)</span>
      <span class="ref">30ml 정품 규격</span>
    </div>
    <div class="row">
      <span class="no">1</span>
      <div class="rb">
        <div class="rm-row">
          <span class="rm-name">Montmorillonite (몬모릴로나이트)</span>
          <span class="rm-val">고함량</span>
        </div>
      </div>
    </div>
    <div class="row">
      <span class="no">2</span>
      <div class="rb">
        <div class="rm-row">
          <span class="rm-name">Bifidobacterium longum</span>
          <span class="rm-val">1.0 x 10¹¹ cfu</span>
        </div>
      </div>
    </div>
    <div class="row">
      <span class="no">3</span>
      <div class="rb">
        <div class="rm-row">
          <span class="rm-name">비타민 A (Vitamin A)</span>
          <span class="rm-val">400,000 IU</span>
        </div>
      </div>
    </div>
    <div class="row">
      <span class="no">4</span>
      <div class="rb">
        <div class="rm-row">
          <span class="rm-name">비타민 D3 (Vitamin D3)</span>
          <span class="rm-val">80,000 IU</span>
        </div>
      </div>
    </div>
    <div class="row">
      <span class="no">5</span>
      <div class="rb">
        <div class="rm-row">
          <span class="rm-name">비타민 E (Vitamin E)</span>
          <span class="rm-val">200 IU</span>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
