<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<link href='https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;800;900&display=swap' rel='stylesheet'>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
body { background: #0b071a; padding: 20px; }
.box-test {
    width: 39mm;
    background: rgba(0, 0, 0, 0.65);
    border: 0.15mm solid #ffd700;
    border-radius: 0.5mm;
    padding: 1.10mm 0.65mm 0.50mm 0.65mm;
    display: flex;
    flex-direction: column;
    gap: 0.35mm;
}
.row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    white-space: nowrap;
    line-height: 1;
}
.eff-item {
    font-size: 1.18mm;
    font-weight: 800;
    color: #ffffff;
    display: inline-flex;
    align-items: center;
    gap: 0.3mm;
    white-space: nowrap;
}
.eff-dot {
    width: 0.55mm;
    height: 0.55mm;
    border-radius: 50%;
    background: #ffd700;
    flex-shrink: 0;
}
.eff-note {
    font-size: 0.95mm;
    color: #fcd34d;
    font-weight: 700;
    white-space: nowrap;
}
</style>
</head>
<body>
<div class='box-test'>
    <div class='row'>
        <span class='eff-item'><span class='eff-dot'></span>요소(Urea) 및 요독 배출 촉진</span>
        <span class='eff-item'><span class='eff-dot'></span>인독실설페이트 흡착 제거</span>
    </div>
    <div class='row'>
        <span class='eff-item'><span class='eff-dot'></span>신장 수치 안정화 보조</span>
        <span class='eff-item'><span class='eff-dot'></span>활력 증진 및 에너지 대사</span>
        <span class='eff-note'>*등의 개선에 도움</span>
    </div>
</div>
</body>
</html>
