<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>몬스멕타(MONSMECTA) 라인업 라벨 스튜디오 &amp; 인쇄 센터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Jua&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <style>
        body {
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
            background-color: #0b1110;
            color: #f4fff9;
        }
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #10b981;
            border-radius: 4px;
        }
        .tab-btn.active {
            font-weight: 900;
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-[#0b1110] text-emerald-50">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-50 bg-[#0f1715]/95 backdrop-blur-md border-b border-emerald-900/60 px-6 py-3.5 shadow-2xl transition-all" id="header-bar">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <span class="text-2xl">🐾</span>
                <div>
                    <h1 class="text-lg font-black tracking-tight text-white flex items-center gap-2">
                        MONSMECTA™ <span class="text-[#d8f46a] text-xs font-bold px-2.5 py-0.5 rounded-full bg-[#1b2b25] border border-[#10b981]/40">COLOR IDENTITY EDITION</span>
                    </h1>
                    <p class="text-[11px] text-emerald-300 font-medium">몬스멕타 11종 제품별 고유 정체성(색상) 라벨 스튜디오 (100ml 표준 정품 규격 실측 인쇄)</p>
                </div>
            </div>

            <!-- Global Action Controls -->
            <div class="flex items-center gap-3">
                <!-- Style Selector -->
                <div class="flex items-center bg-[#070d0b] p-1 rounded-xl border border-emerald-800/60">
                    <button id="style-tight" onclick="changeDesignStyle('tight')" class="px-3.5 py-1.5 rounded-lg text-xs font-black transition-all bg-[#10b981] text-white">
                        🏆 100ml 정품 라벨 (타이트 실측)
                    </button>
                    <button id="style-modern" onclick="changeDesignStyle('modern')" class="px-3.5 py-1.5 rounded-lg text-xs font-bold text-emerald-300 hover:text-white transition-all">
                        ✨ 모던 에디션
                    </button>
                    <button id="style-youth" onclick="changeDesignStyle('youth')" class="px-3.5 py-1.5 rounded-lg text-xs font-bold text-emerald-300 hover:text-white transition-all">
                        🌱 유스 에디션
                    </button>
                </div>

                <!-- Size Switcher (100ml / 30ml) -->
                <div class="flex items-center bg-[#070d0b] p-1 rounded-xl border border-emerald-800/60">
                    <button id="size-100" onclick="changeGlobalSize('100')" class="px-3.5 py-1.5 rounded-lg text-xs font-black transition-all bg-[#d8f46a] text-[#06402f]">
                        📦 100ml
                    </button>
                    <button id="size-30" onclick="changeGlobalSize('30')" class="px-3.5 py-1.5 rounded-lg text-xs font-bold text-emerald-300 hover:text-white transition-all">
                        🧴 30ml
                    </button>
                </div>

                <!-- Print Direct -->
                <button onclick="printFrame()" class="flex items-center gap-1.5 px-4 py-2 bg-gradient-to-r from-emerald-500 to-[#10b981] hover:brightness-110 text-white rounded-xl text-xs font-black shadow-lg shadow-emerald-950 transition-all">
                    <span>🖨️ 현재 라벨 인쇄</span>
                </button>
                <button onclick="openExternal()" class="flex items-center gap-1 px-3 py-2 bg-[#1b2b25] hover:bg-emerald-800 text-emerald-100 rounded-xl text-xs font-bold transition-all border border-emerald-700/50">
                    <span>새 창 ↗</span>
                </button>
            </div>
        </div>

        <!-- Lineup Horizontal Tabs with Distinct Color Badges -->
        <div class="max-w-7xl mx-auto mt-3 overflow-x-auto custom-scrollbar pb-1">
            <div class="flex items-center gap-2 min-w-max" id="tabs-container">
                <!-- Tabs injected by JS -->
            </div>
        </div>
    </header>

    <!-- Main Preview Stage (Full View) -->
    <main class="flex-1 p-4 lg:p-6 flex flex-col items-center justify-start max-w-7xl w-full mx-auto">
        <!-- Specs Bar -->
        <div class="w-full bg-[#131f1c]/90 border border-emerald-800/50 rounded-2xl px-5 py-3.5 mb-4 flex flex-wrap items-center justify-between gap-3 text-xs shadow-lg">
            <div class="flex items-center gap-3">
                <span class="w-3.5 h-3.5 rounded-full border border-white/50 shadow-sm" id="info-dot"></span>
                <span class="font-extrabold text-white text-sm" id="info-title">몬스멕타 오리지널</span>
                <span class="px-2 py-0.5 rounded text-[10px] font-black border" id="info-color-tag">DEEP EMERALD</span>
                <span class="text-emerald-300 ml-2" id="info-tagline">연변 시 장 기능 개선 및 정장 작용에 뛰어난</span>
            </div>
            <div class="flex items-center gap-4 text-emerald-200">
                <span>규격: <b class="text-[#d8f46a]" id="info-dims">123mm × 75mm</b></span>
                <span>접착 여백: <b class="text-white">좌 7mm + 중 7mm + 우 3mm</b></span>
                <span>모드: <b class="text-white">화이트 / 딥그린 뒷면 지원</b></span>
            </div>
        </div>

        <!-- Label Viewer Container (iframe) -->
        <div class="w-full bg-[#070d0b] border border-emerald-900/80 rounded-2xl shadow-2xl overflow-hidden flex flex-col items-center justify-center p-2 lg:p-4 min-h-[820px]">
            <iframe id="label-frame" class="w-full h-[800px] border-0 rounded-xl bg-white shadow-inner" src="01_몬스멕타_100ml_라벨.html"></iframe>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-[#070d0b] border-t border-emerald-900/60 py-4 px-6 text-center text-xs text-emerald-400">
        <p>S&amp;J ADVANCED VET FORMULA · MONSMECTA™ COLOR IDENTITY SYSTEM · 엠오바이오 / 에스앤제이 동물병원</p>
    </footer>

    <script>
        const lineup = [
            { id: '01', name: '01. 오리지널', tightFile: '01_몬스멕타_100ml_라벨.html', modernFile: '01_monsmecta_original_modern.html', youthFile: '01_monsmecta_original_youth.html', tagline: '연변 시 장 기능 개선 및 정장 작용에 뛰어난', color: '#10b981', tag: 'DEEP EMERALD', text: '에메랄드 딥그린' },
            { id: '02', name: '02. 헤파맥스', tightFile: '02_몬스멕타_헤파맥스_100ml_라벨.html', modernFile: '02_monsmecta_hepamax_modern.html', youthFile: '02_monsmecta_hepamax_youth.html', tagline: '간 기능 보호 및 해독 활성화 보조제', color: '#ea580c', tag: 'VIVID RED-ORANGE', text: '딥 오렌지/레드' },
            { id: '03', name: '03. 레날 디톡스', tightFile: '03_몬스멕타_레날_디톡스_100ml_라벨.html', modernFile: '03_monsmecta_renal_modern.html', youthFile: '03_monsmecta_renal_youth.html', tagline: '비뇨기 및 신장 건강 보조제', color: '#2563eb', tag: 'ROYAL BLUE', text: '로열 딥블루' },
            { id: '04', name: '04. 캔서케어', tightFile: '04_몬스멕타_캔서케어_100ml_라벨.html', modernFile: '04_monsmecta_cancercare_modern.html', youthFile: '04_monsmecta_cancercare_youth.html', tagline: '면역 증진 및 종양 억제 보조제', color: '#c084fc', tag: 'ROYAL PURPLE', text: '로열 퍼플' },
            { id: '05', name: '05. 콜드제로', tightFile: '05_몬스멕타_콜드제로_100ml_라벨.html', modernFile: '05_monsmecta_coldzero_modern.html', youthFile: '05_monsmecta_coldzero_youth.html', tagline: '호흡기 및 감기 예방 보조제', color: '#22d3ee', tag: 'CYAN AQUA', text: '시안 아쿠아' },
            { id: '06', name: '06. 스킨케어', tightFile: '06_몬스멕타_스킨케어_100ml_라벨.html', modernFile: '06_monsmecta_skincare_modern.html', youthFile: '06_monsmecta_skincare_youth.html', tagline: '피부 및 아토피 개선 보조제', color: '#f472b6', tag: 'ROSE PINK', text: '로즈 핑크' },
            { id: '07', name: '07. 하트케어', tightFile: '07_몬스멕타_하트케어_100ml_라벨.html', modernFile: '07_monsmecta_heartcare_modern.html', youthFile: '07_monsmecta_heartcare_youth.html', tagline: '심장 및 혈행 건강 보조제', color: '#dc2626', tag: 'CRIMSON RED', text: '크림슨 레드' },
            { id: '08', name: '08. 조인트케어', tightFile: '08_몬스멕타_조인트케어_100ml_라벨.html', modernFile: '08_monsmecta_jointcare_modern.html', youthFile: '08_monsmecta_jointcare_youth.html', tagline: '관절 및 연골 건강 보조제', color: '#84cc16', tag: 'OLIVE LIME', text: '올리브 라임' },
            { id: '09', name: '09. 파워에이스', tightFile: '09_몬스멕타_파워라제_100ml_라벨.html', modernFile: '09_monsmecta_powerase_modern.html', youthFile: '09_monsmecta_powerase_youth.html', tagline: '기력 및 활력 회복 보조제', color: '#f97316', tag: 'VIVID ORANGE', text: '비비드 오렌지' },
            { id: '10', name: '10. 프로바이오틱스', tightFile: '10_몬스멕타_프로바이오틱스_100ml_라벨.html', modernFile: '10_monsmecta_probiotics_modern.html', youthFile: '10_monsmecta_probiotics_youth.html', tagline: '세계 3대 유산균 듀퐁 다니스코 프리미엄 적용', color: '#22c55e', tag: 'VITAL GREEN', text: '바이탈 그린' },
            { id: '11', name: '11. 비타플러스', tightFile: '11_몬스멕타_비타플러스_100ml_라벨.html', modernFile: '11_monsmecta_vitaplus_modern.html', youthFile: '11_monsmecta_vitaplus_youth.html', tagline: '종합 비타민 및 미네랄 보조제', color: '#eab308', tag: 'GOLDEN YELLOW', text: '골든 옐로우' }
        ];

        let currentProduct = lineup[0];
        let currentSize = '100';
        let currentStyle = 'tight';

        function changeDesignStyle(style) {
            currentStyle = style;
            document.getElementById('style-tight').className = style === 'tight'
                ? 'px-3.5 py-1.5 rounded-lg text-xs font-black transition-all bg-[#10b981] text-white shadow-md'
                : 'px-3.5 py-1.5 rounded-lg text-xs font-bold text-emerald-300 hover:text-white transition-all';
            document.getElementById('style-modern').className = style === 'modern'
                ? 'px-3.5 py-1.5 rounded-lg text-xs font-black transition-all bg-[#10b981] text-white shadow-md'
                : 'px-3.5 py-1.5 rounded-lg text-xs font-bold text-emerald-300 hover:text-white transition-all';
            document.getElementById('style-youth').className = style === 'youth'
                ? 'px-3.5 py-1.5 rounded-lg text-xs font-black transition-all bg-[#d9f548] text-[#0b3b2c] shadow-md'
                : 'px-3.5 py-1.5 rounded-lg text-xs font-bold text-emerald-300 hover:text-white transition-all';
            updateViewer();
        }

        function renderTabs() {
            const container = document.getElementById('tabs-container');
            container.innerHTML = '';
            lineup.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = `tab-btn flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all border border-emerald-800/80 bg-[#14201c] hover:bg-[#1f302b] ${index === 0 ? 'active' : 'text-emerald-200'}`;
                
                // Color dot
                const dot = document.createElement('span');
                dot.className = 'w-2.5 h-2.5 rounded-full flex-shrink-0 shadow-sm';
                dot.style.backgroundColor = item.color;
                
                const span = document.createElement('span');
                span.textContent = item.name;

                btn.appendChild(dot);
                btn.appendChild(span);

                if (index === 0) {
                    btn.style.backgroundColor = item.color;
                    btn.style.color = '#0b1110';
                    btn.style.borderColor = item.color;
                }

                btn.onclick = () => selectProduct(item, btn);
                container.appendChild(btn);
            });
        }

        function selectProduct(item, btnElem) {
            currentProduct = item;
            document.querySelectorAll('.tab-btn').forEach((b, idx) => {
                b.classList.remove('active');
                b.style.backgroundColor = '#14201c';
                b.style.color = '#a7f3d0';
                b.style.borderColor = 'rgba(6, 78, 59, 0.8)';
            });
            btnElem.classList.add('active');
            btnElem.style.backgroundColor = item.color;
            btnElem.style.color = '#0b1110';
            btnElem.style.borderColor = item.color;

            updateViewer();
        }

        function changeGlobalSize(size) {
            currentSize = size;
            document.getElementById('size-100').className = size === '100'
                ? 'px-3.5 py-1.5 rounded-lg text-xs font-black transition-all bg-[#d8f46a] text-[#06402f]'
                : 'px-3.5 py-1.5 rounded-lg text-xs font-bold text-emerald-300 hover:text-white transition-all';
            document.getElementById('size-30').className = size === '30'
                ? 'px-3.5 py-1.5 rounded-lg text-xs font-black transition-all bg-[#d8f46a] text-[#06402f]'
                : 'px-3.5 py-1.5 rounded-lg text-xs font-bold text-emerald-300 hover:text-white transition-all';

            document.getElementById('info-dims').textContent = size === '100' ? (currentStyle === 'classic' ? '123mm × 75mm' : '118mm × 76mm') : '101mm × 42mm';
            updateViewer();
        }

        function updateViewer() {
            const frame = document.getElementById('label-frame');
            const dims = currentSize === '100' ? '118mm × 76mm' : '101mm × 42mm';
            if (currentStyle === 'youth') {
                const targetUrl = `${currentProduct.youthFile || currentProduct.modernFile}?size=${currentSize}`;
                frame.src = targetUrl;
                document.getElementById('info-title').textContent = `${currentProduct.name} 유스 에디션 (${currentSize}ml)`;
                document.getElementById('info-tagline').textContent = `${currentProduct.tagline} · 가독성 개선 시안 (밝은 크림/민트 톤)`;
                document.getElementById('info-dims').textContent = dims;
            } else if (currentStyle === 'modern') {
                const targetUrl = `${currentProduct.modernFile}?size=${currentSize}`;
                frame.src = targetUrl;
                document.getElementById('info-title').textContent = `${currentProduct.name} 모던 (${currentSize}ml)`;
                document.getElementById('info-tagline').textContent = `${currentProduct.tagline} · 모던 ${currentProduct.tag}`;
                document.getElementById('info-dims').textContent = dims;
            } else {
                frame.src = currentProduct.tightFile;
                document.getElementById('info-title').textContent = `${currentProduct.name} 100ml 정품 라벨 (타이트 실측)`;
                document.getElementById('info-tagline').textContent = `${currentProduct.tagline} · 화이트/다크 배면 실측 인쇄용`;
                document.getElementById('info-dims').textContent = '110mm × 75mm (A4 1:1 실측 인쇄)';
            }
            
            const dot = document.getElementById('info-dot');
            dot.style.backgroundColor = currentProduct.color;

            const tag = document.getElementById('info-color-tag');
            tag.textContent = currentStyle === 'youth' ? 'YOUTH · 100ml' : (currentStyle === 'modern' ? `MODERN · ${currentProduct.tag}` : `OFFICIAL 100ml · ${currentProduct.tag}`);
            tag.style.color = currentProduct.color;
            tag.style.borderColor = currentProduct.color;
            tag.style.backgroundColor = `${currentProduct.color}22`;
        }

        function printFrame() {
            const frame = document.getElementById('label-frame');
            if (frame && frame.contentWindow) {
                frame.contentWindow.print();
            }
        }

        function openExternal() {
            if (currentStyle === 'youth') {
                window.open(`${currentProduct.youthFile || currentProduct.modernFile}?size=${currentSize}`, '_blank');
            } else if (currentStyle === 'modern') {
                window.open(`${currentProduct.modernFile}?size=${currentSize}`, '_blank');
            } else {
                window.open(currentProduct.tightFile, '_blank');
            }
        }

        renderTabs();
        updateViewer();
    </script>
</body>
</html>
